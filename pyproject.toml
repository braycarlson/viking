[project]
name = "viking"
description = "A Discord bot"
version = "1.0"
authors = [
    { name = "Brayden Carlson", email = "braycarlson@hotmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "aiodns",
    "asyncpg",
    "charset-normalizer",
    "msgspec",
    "networkx",
    "paramiko",
    "pillow",
    "pycares",
    "python-dateutil",
    "rapidfuzz",
    "slapshot",
    "sqlalchemy[asyncio]>=2.0",
    "tabulate",
    "typing-extensions",
    "wheel; sys_platform == 'linux'",
    "discord.py[voice] @ git+https://github.com/Rapptz/discord.py",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend = "ruff.toml"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
